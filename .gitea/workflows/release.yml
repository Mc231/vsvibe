name: Release (notarized DMG, GitHub Release, Sparkle appcast)

# A `vX.Y.Z` tag pushed to GitHub arrives through the Gitea pull-mirror and:
#   1. checks CHANGELOG.md has a `## [X.Y.Z]` section (fails otherwise), then
#      strict lint, appcast tests, unit tests + coverage, analyze;
#   2. builds X.Y.Z with build number `git rev-list --count HEAD`, signs it with
#      Developer ID (temporary keychain), notarizes + staples app and DMG;
#   3. signs the DMG for Sparkle (EdDSA), creates the GitHub Release with the
#      DMG and the CHANGELOG section as notes;
#   4. adds the version to appcast.xml on the `gh-pages` branch of GitHub
#      (https://mc231.github.io/vsvibe/appcast.xml).
# It never pushes to `main` nor to the Gitea mirror.
#
# Secrets (one-time owner setup, scripts/NOTARIZE.md):
#   DEVELOPER_ID_P12_BASE64, DEVELOPER_ID_P12_PASSWORD   Developer ID Application cert
#   ASC_API_KEY_ID, ASC_API_ISSUER_ID, ASC_API_KEY_P8_BASE64   notarytool API key
#   SPARKLE_ED_PRIVATE_KEY   Sparkle EdDSA private key (generate_keys -x output)
#   GH_RELEASE_TOKEN         fine-grained PAT, Contents: write on Mc231/vsvibe
#
# Every key file lives under $RUNNER_TEMP (never /tmp) and is removed by the
# always-run cleanup step, together with the temporary keychain.

on:
  push:
    tags:
      - 'v*'

defaults:
  run:
    shell: bash

env:
  GITHUB_REPO: Mc231/vsvibe
  APPCAST_URL: https://mc231.github.io/vsvibe/appcast.xml

jobs:
  release:
    name: Test, notarize, publish
    runs-on: macos
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The build number is the commit count, so the full history is needed.
          fetch-depth: 0

      - name: Version, build number and release notes
        id: version
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is not set}"
          tag="$GITHUB_REF_NAME"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag $tag is not vX.Y.Z"
            exit 1
          fi
          version="${tag#v}"
          # Fails when CHANGELOG.md has no `## [X.Y.Z]` section.
          python3 -I tools/appcast.py notes "$version" > "$RUNNER_TEMP/release-notes.md"
          build="$(git rev-list --count HEAD)"
          {
            echo "version=$version"
            echo "build=$build"
            echo "dmg=build/VSVibe-$version.dmg"
            echo "url=https://github.com/$GITHUB_REPO/releases/download/$tag/VSVibe-$version.dmg"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing VSVibe $version (build $build)"

      - name: Strict lint
        run: tools/lint.sh

      - name: Appcast / changelog tool tests
        run: python3 -I -m unittest discover -s tools -p 'test_*.py'

      - name: Build + unit tests + core coverage >= 90%
        run: tools/test.sh

      - name: SwiftLint analyze + Periphery (unused code)
        run: tools/lint.sh --analyze

      - name: Import Developer ID certificate (temporary keychain)
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          echo "::add-mask::$P12_PASSWORD"
          keychain="$RUNNER_TEMP/vsvibe-signing.keychain-db"
          p12="$RUNNER_TEMP/developer-id.p12"
          keychain_password="$(uuidgen)"
          echo "::add-mask::$keychain_password"
          umask 077
          # Remember the user search list so cleanup can restore it.
          security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//' > "$RUNNER_TEMP/keychains.orig"
          printf '%s' "$P12_BASE64" | base64 -D > "$p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -f pkcs12 -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          rm -P "$p12"
          keychains=("$keychain")
          while IFS= read -r line; do
            [[ -n "$line" ]] && keychains+=("$line")
          done < "$RUNNER_TEMP/keychains.orig"
          security list-keychains -d user -s "${keychains[@]}"
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | awk '/"Developer ID Application: / { print $2; exit }')"
          if [[ -z "$identity" ]]; then
            echo "::error::no Developer ID Application identity in DEVELOPER_ID_P12_BASE64"
            exit 1
          fi
          {
            echo "SIGN_KEYCHAIN=$keychain"
            echo "SIGN_IDENTITY=$identity"
          } >> "$GITHUB_ENV"

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          p8="$RUNNER_TEMP/asc-api-key.p8"
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 -D > "$p8"
          echo "ASC_API_KEY_PATH=$p8" >> "$GITHUB_ENV"

      - name: Build, sign, notarize and staple DMG
        env:
          NOTARIZE: '1'
          MARKETING_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          echo "::add-mask::$ASC_API_KEY_ID"
          echo "::add-mask::$ASC_API_ISSUER_ID"
          scripts/build-dmg.sh
          cp build/VSVibe.dmg "${{ steps.version.outputs.dmg }}"

      - name: Sign the DMG for Sparkle (EdDSA)
        id: sparkle
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          DMG: ${{ steps.version.outputs.dmg }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/sparkle_ed25519.key"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$key"
          sign_update="$(scripts/sparkle-tool.sh sign_update build/dd-release)"
          # Prints: sparkle:edSignature="..." length="..."
          attributes="$("$sign_update" --ed-key-file "$key" "$DMG")"
          signature="$(sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p' <<< "$attributes")"
          length="$(sed -n 's/.*length="\([0-9]*\)".*/\1/p' <<< "$attributes")"
          if [[ -z "$signature" || "$length" != "$(stat -f %z "$DMG")" ]]; then
            echo "::error::unexpected sign_update output"
            exit 1
          fi
          "$sign_update" --verify --ed-key-file "$key" "$DMG" "$signature"
          rm -P "$key"
          {
            echo "signature=$signature"
            echo "length=$length"
          } >> "$GITHUB_OUTPUT"

      - name: Upload notarized DMG
        uses: actions/upload-artifact@v3
        with:
          name: VSVibe-${{ github.ref_name }}
          path: ${{ steps.version.outputs.dmg }}
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          DMG: ${{ steps.version.outputs.dmg }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --repo "$GITHUB_REPO" > /dev/null 2>&1; then
            # Re-run of the same tag: replace the asset, refresh the notes.
            gh release upload "$tag" "$DMG" --repo "$GITHUB_REPO" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPO" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$tag" "$DMG" \
              --repo "$GITHUB_REPO" \
              --verify-tag \
              --title "VSVibe $VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

      - name: Publish appcast.xml on gh-pages
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
          URL: ${{ steps.version.outputs.url }}
          LENGTH: ${{ steps.sparkle.outputs.length }}
          SIGNATURE: ${{ steps.sparkle.outputs.signature }}
        run: |
          set -euo pipefail
          remote="https://github.com/$GITHUB_REPO.git"
          pages="$RUNNER_TEMP/gh-pages"
          rm -rf "$pages"
          # Token as an HTTP header for this process only: never in a remote
          # URL or in .git/config.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth"
          git_gh() {
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" "$@"
          }
          if git_gh ls-remote --exit-code --heads "$remote" gh-pages > /dev/null; then
            git_gh clone --quiet --depth 1 --branch gh-pages "$remote" "$pages"
          else
            git init --quiet "$pages"
            git -C "$pages" checkout --quiet --orphan gh-pages
          fi
          python3 -I tools/appcast.py update \
            --appcast "$pages/appcast.xml" \
            --changelog CHANGELOG.md \
            --version "$VERSION" \
            --build "$BUILD" \
            --url "$URL" \
            --length "$LENGTH" \
            --ed-signature "$SIGNATURE" \
            --min-system 15.0
          touch "$pages/.nojekyll"
          git -C "$pages" add appcast.xml .nojekyll
          if git -C "$pages" diff --cached --quiet; then
            echo "appcast already lists $VERSION"
            exit 0
          fi
          git -C "$pages" \
            -c user.name="VSVibe Release" \
            -c user.email="vsvibe-release@users.noreply.github.com" \
            commit --quiet -m "appcast: VSVibe $VERSION (build $BUILD)"
          git_gh -C "$pages" push "$remote" HEAD:refs/heads/gh-pages
          echo "Published $VERSION to $APPCAST_URL"

      - name: Clean up keychain and key files
        if: ${{ always() }}
        run: |
          set -uo pipefail
          if [[ -f "$RUNNER_TEMP/keychains.orig" ]]; then
            original=()
            while IFS= read -r line; do
              [[ -n "$line" ]] && original+=("$line")
            done < "$RUNNER_TEMP/keychains.orig"
            if [[ ${#original[@]} -gt 0 ]]; then
              security list-keychains -d user -s "${original[@]}"
            fi
            rm -f "$RUNNER_TEMP/keychains.orig"
          fi
          security delete-keychain "$RUNNER_TEMP/vsvibe-signing.keychain-db" 2> /dev/null || true
          for file in developer-id.p12 asc-api-key.p8 sparkle_ed25519.key; do
            if [[ -f "$RUNNER_TEMP/$file" ]]; then
              rm -P "$RUNNER_TEMP/$file"
            fi
          done
          rm -rf "$RUNNER_TEMP/gh-pages" "$RUNNER_TEMP/release-notes.md"
