sonar.projectKey=vsvibe
sonar.projectName=VSVibe
# sonar.projectVersion is passed by tools/sonar_scan.sh (CFBundleShortVersionString).

sonar.sources=VSVibe
sonar.tests=VSVibeTests
sonar.sourceEncoding=UTF-8

# Non-code resources
sonar.exclusions=**/*.xcassets/**,VSVibe/Resources/**

# Coverage exclusions = everything outside the "testable core" (CLAUDE.md):
# SwiftUI views, the @main entry, the composition root, SwiftTerm spawning and
# AppKit/notification glue. tools/check_coverage.py reads THIS list, so the
# local/CI coverage gate and the Sonar gate always measure the same files.
sonar.coverage.exclusions=VSVibe/UI/**,VSVibe/VSVibeApp.swift,VSVibe/AppEnvironment.swift,VSVibe/Terminal/TerminalHostView.swift,VSVibe/Terminal/LocalProcessTerminalView+Spawn.swift,VSVibe/Notifications/AppNotifications.swift,VSVibe/Model/TerminalSession.swift

sonar.test.exclusions=**/test*/fixtures/**

# sonar-apple: runs SwiftLint (.swiftlint.yml) and imports tests, coverage and
# compiler warnings from the result bundle, plus Periphery from the index store.
# Produce both with tools/test.sh first.
sonar.apple.resultBundlePath=build/ci/result.xcresult
sonar.apple.periphery.indexStorePath=build/ci/dd/Index.noindex/DataStore

sonar.qualitygate.wait=true
